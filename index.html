<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="description" content="ZAHNTECHNIK Frankenberg GmbH - Ihr Meisterlabor für hochwertigen Zahnersatz." />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZAHNTECHNIK Frankenberg GmbH</title>
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalBusiness",
        "name": "B&S Zahntechnik Frankenberg GmbH",
        "telephone": "+49 37206 75542",
        "email": "info@zahnhandel.de",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Gewerbering 17",
          "addressLocality": "Frankenberg/Sa.",
          "postalCode": "09669",
          "addressCountry": "DE"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": "50.9032014098674",
          "longitude": "13.051045537119911"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday"],
            "opens": "07:00",
            "closes": "19:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Friday",
            "opens": "07:00",
            "closes": "17:00"
          }
        ],
        "priceRange": "$$"
      }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Statisches Formular für Netlify  Vite/React Workaround ) -->
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <select name="reason">
      <option value="anfrage"></option>
      <option value="kostenvoranschlag"></option>
      <option value="termin"></option>
      <option value="bewerbung"></option>
      <option value="sonstiges"></option>
    </select>
    <input type="text" name="subject" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>
</body>

</html>
